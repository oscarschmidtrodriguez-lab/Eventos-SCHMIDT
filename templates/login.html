{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-logo">Eventos Schmidt</div>
  <div class="auth-card">
    <h1>Iniciar sesión en Eventos Schmidt</h1>
    <form method="post">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autofocus required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="auth-submit">Iniciar sesión</button>
    </form>

    {% if google_enabled %}
    <div class="login-divider"><span>o</span></div>
    <a class="button-secondary auth-secondary" href="{{ url_for('auth.login_google') }}">
      Continuar con Google
    </a>
    {% endif %}
  </div>

  <div class="auth-switch">
    <p>¿No tienes cuenta?</p>
    <a class="auth-outline-button" href="{{ url_for('auth.registro') }}">Regístrate en Eventos Schmidt</a>
  </div>
</div>
{% endblock %}
