{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-icon">ES</div>
  <div class="auth-card">
    <h1>Crea tu cuenta</h1>
    <form method="post">
      <div id="step-email">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autofocus required value="{{ email or '' }}">

        <button type="button" class="auth-submit" id="btn-continuar">Continuar</button>
      </div>

      <div id="step-password" hidden>
        <div class="auth-email-summary">
          <span id="email-display"></span>
          <button type="button" class="auth-change-email" id="btn-cambiar-email">Cambiar</button>
        </div>

        <label for="password">Crea una contraseña</label>
        <input type="password" id="password" name="password" minlength="6">

        <label for="password2">Repite la contraseña</label>
        <input type="password" id="password2" name="password2" minlength="6">

        <button type="submit" class="auth-submit">Crear cuenta</button>
      </div>
    </form>
  </div>

  {% if not session.get('user_id') %}
  <div class="auth-switch">
    <p>¿Ya tienes cuenta?</p>
    <a class="auth-outline-button" href="{{ url_for('auth.login') }}">Iniciar sesión</a>
  </div>
  {% endif %}
</div>

<script>
(function () {
  var emailInput = document.getElementById("email");
  var stepEmail = document.getElementById("step-email");
  var stepPassword = document.getElementById("step-password");
  var emailDisplay = document.getElementById("email-display");
  var passwordInput = document.getElementById("password");
  var password2Input = document.getElementById("password2");

  function showPasswordStep() {
    if (!emailInput.reportValidity()) return;
    emailDisplay.textContent = emailInput.value;
    stepEmail.hidden = true;
    stepPassword.hidden = false;
    passwordInput.required = true;
    password2Input.required = true;
    passwordInput.focus();
  }

  function showEmailStep() {
    stepPassword.hidden = true;
    stepEmail.hidden = false;
    passwordInput.required = false;
    password2Input.required = false;
    emailInput.focus();
  }

  document.getElementById("btn-continuar").addEventListener("click", showPasswordStep);
  document.getElementById("btn-cambiar-email").addEventListener("click", showEmailStep);

  {% if show_password_step %}
  showPasswordStep();
  {% endif %}
})();
</script>
{% endblock %}
